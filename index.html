<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f5f5f5" id="metaTema">
<meta name="robots" content="noindex, nofollow">
<title>Territorios Alameda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- `default` y NO `black-translucent`. Con la barra translúcida, iOS deja que la
     app se dibuje bajo la isla dinámica, pero le entrega un viewport más corto
     que la pantalla justo en ese alto: medido en un iPhone 15 Pro, pantalla 852,
     viewport 793, área segura de arriba 59. La app terminaba 59 px antes del
     borde inferior y esa franja queda FUERA del documento, así que no hay forma
     de llenarla: no la tapa ni el fondo de un modal. Con `default`, iOS coloca la
     app bajo la barra de estado, el área segura de arriba pasa a 0 y la app llega
     al borde. De paso el header se ahorra esos 59 px de relleno, que se los queda
     el mapa. La barra de estado la pinta el sistema con el `theme-color`, que va
     en `--surface`, el mismo color del header: se lee como si siguiera. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- el tema elegido se aplica antes de cargar el CSS, o la app parpadea en
     claro un instante antes de ponerse oscura -->
<script>
try { var t = localStorage.getItem('alameda_tema');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="leaflet.css">
<style>
/* ---------------------------------------------------------------------------
   Lenguaje visual monocromo: todo se construye con una escala de grises y la
   tipografía es el elemento gráfico. El color solo aparece donde significa algo
   —el rojo de lo marcado, el verde de lo hecho— y en los territorios, que
   llevan el color que les puso el plano de la congregación: eso es dato, no
   diseño. Nunca un color literal en un componente; siempre un token.
--------------------------------------------------------------------------- */
:root{
  --bg:#e6e6e6;         /* fondo de página */
  --surface:#f5f5f5;    /* tarjetas, barras, paneles */
  --surface-2:#d8d8d8;  /* pistas, fondos de selectores segmentados */
  --text:#0b0b0b;
  --text-2:#737373;
  --border:#cbcbcb;
  --ink:#0b0b0b;        /* relleno del botón primario y de la tarjeta invertida */
  --ink-text:#f5f5f5;
  --danger:#d9472e;     /* lo marcado, lo que detiene */
  --success:#2e8f5a;    /* lo cumplido */
  --on-color:#ffffff;
  --radius:18px;
  --pill:999px;
  /* El alto del indicador de inicio del iPhone: 0 en el navegador y ~34 px en la
     PWA instalada. Se reserva siempre con `max(...)`, nunca sumándolo a un
     padding, o en el celular el hueco sale del doble de lo que hace falta. */
  --safe-b:env(safe-area-inset-bottom,0px);
  /* Lo que se escribe ENCIMA del mapa —números, letras, la chapa del día— no
     sigue el tema de la interfaz sino el fondo del mapa, que se elige aparte:
     con la app en claro se puede estar mirando el mapa Oscuro. */
  --map-ink:#1f1f1f; --map-ink-2:#5a5a5a; --map-paper:#ffffff;
  color-scheme:light;
}
/* En Mapa manda el fondo elegido; en Dibujo, el papel sobre el que se dibuja.
   Son dos cosas distintas y por eso son cuatro reglas. */
body.dibujo{--map-paper:#fdfdfb}
body:not(.dibujo).fondo-oscuro{--map-ink:#f2f2f2; --map-ink-2:#8f8f8f; --map-paper:#0b0b0b}
body.dibujo.dibujo-oscuro{--map-ink:#f2f2f2; --map-ink-2:#8f8f8f; --map-paper:#141a21}
/* oscuro: el claro invertido. Automático por sistema salvo que se fuerce claro */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0b; --surface:#171717; --surface-2:#262626;
    --text:#ececec; --text-2:#8c8c8c; --border:#2c2c2c;
    --ink:#ececec; --ink-text:#0b0b0b;
    --danger:#e8654d; --success:#47b273;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --surface:#171717; --surface-2:#262626;
  --text:#ececec; --text-2:#8c8c8c; --border:#2c2c2c;
  --ink:#ececec; --ink-text:#0b0b0b;
  --danger:#e8654d; --success:#47b273;
  color-scheme:dark;
}

/* Space Grotesk variable, en el repo con licencia OFL (fonts/OFL.txt) */
@font-face{
  font-family:'Space Grotesk';
  src:url('fonts/SpaceGrotesk.woff2') format('woff2');
  font-weight:300 700; font-style:normal; font-display:swap;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* El lienzo —lo que queda fuera del documento si el viewport que da el sistema
   es más corto que la pantalla— toma su color de <html>. Se le pone el de la
   barra de abajo, que es contra la que asomaría, para que esa franja se lea como
   su continuación y no como un hueco. */
html{background:var(--surface)}
/* Sin `tabular-nums`: con esa figura la Space Grotesk le pone al 1 un remate en
   la base que se lee como un subrayado. Aquí no hay ninguna columna de números
   que deba alinearse —las horas van en tarjetas sueltas y los días, centrados en
   discos de ancho fijo—, así que la figura tabular no compraba nada. */
body{margin:0;
  font:500 15px/1.45 'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden}
/* `height:100%` y no `100dvh`: **instalada como PWA, iOS calcula `dvh` de menos**,
   le resta el alto del área segura de arriba. En un iPhone 15 Pro —852 px de
   pantalla, 59 de isla dinámica— `100dvh` da 793, y la app termina 59 px antes
   del borde dejando ver el fondo de la página. En el navegador no pasa, así que
   no se nota probando ahí. `html` y `body` ya miden 100%, y como `body` va con
   `overflow:hidden` las barras del navegador nunca se repliegan: el 100% es
   exactamente lo mismo que `dvh` allí, sin el error. */
#app{display:flex;flex-direction:column;height:100%}
button,.btn,.go,.fab,.iconbtn{font:inherit}
button:active,.btn:active,.fab:active,.iconbtn:active,.wd:active{transform:scale(.97);opacity:.85}
/* el foco del navegador viene en azul o naranja según el sistema: se trae al
   sistema de color, que no tiene ni uno ni otro */
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* El header es una línea: el nombre de la app, el mes, y el botón de ajustes
   puesto encima en absoluto para que no le agregue alto. */
header{position:relative;background:var(--surface);border-bottom:1px solid var(--border);
  padding:5px 38px 5px;padding-top:calc(5px + env(safe-area-inset-top,0px));z-index:600}
.titulo{font-size:15px;font-weight:500;letter-spacing:.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-align:center}
.titulo span{color:var(--text-2)}
.titulo span::before{content:' · '}
#btnAjustes{position:absolute;right:6px;bottom:3px;width:30px;height:26px;border:0;
  background:transparent;color:var(--text-2);border-radius:var(--pill);
  font-size:17px;line-height:1;cursor:pointer;padding:0}

.iconbtn{border:1px solid var(--border);background:transparent;color:var(--text);
  border-radius:var(--pill);min-width:38px;height:34px;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px}

/* La tira de días vive al pie de la hoja, bajo el listado, y es la barra que se
   apoya en el borde inferior de la pantalla. Va sobre `--surface` a propósito:
   instalada como PWA hay que dejarle al indicador de inicio del iPhone sus
   ~34 px libres, y si la barra fuera del color de la página ese espacio se leería
   como un hueco en blanco en vez de como el suelo de la barra. */
.datebar{display:flex;align-items:center;gap:6px;background:var(--surface);
  border-top:1px solid var(--border);
  padding:6px 8px max(6px,var(--safe-b))}
.datebar .flecha{min-width:28px;height:40px;padding:0;font-size:20px;color:var(--text-2);
  border-color:transparent;background:transparent}
.datebar #btnHoy{height:40px;font-size:14px;padding:0 12px}
/* `position` para que el `offsetLeft` de los chips se mida contra la tira y no
   contra el header: si no, posicionarTira() se pasa el ancho de la flecha */
.week{position:relative;flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
/* La tira no lleva botones: los días se leen solos, y encajonar cada uno en una
   píldora los hacía parecer acciones. Queda la tipografía, y lo único dibujado
   es el disco tinta del día elegido —el mismo que marca el territorio del día
   sobre el mapa— y un aro de 1 px alrededor de hoy. */
.wd{flex:0 0 auto;min-width:40px;border:0;background:transparent;cursor:pointer;
  padding:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.wd i{font-style:normal;font-weight:400;font-size:11px;line-height:1.2;color:var(--text-2)}
.wd b{display:flex;width:34px;height:34px;align-items:center;justify-content:center;
  border:1px solid transparent;border-radius:50%;
  font-size:16px;font-weight:500;letter-spacing:-.02em;color:var(--text)}
.wd.sel b{background:var(--ink);border-color:var(--ink);color:var(--ink-text)}
.wd.sel i{color:var(--text)}
.wd.hoy b{border-color:var(--text)}

/* el mapa se mete bajo la hoja para que sus esquinas redondeadas dejen ver el
   mapa por detrás, no un recorte del fondo de página */
#map{flex:1 1 auto;min-height:120px;margin-bottom:-18px;background:var(--surface-2);z-index:1}
.leaflet-container{font:inherit;background:var(--surface-2)}
/* la especificidad la manda leaflet.css (`.leaflet-container .leaflet-...`), que
   le pone `margin:0`; hay que igualarla para poder subirla sobre la hoja */
.leaflet-container .leaflet-control-attribution{background:var(--surface);color:var(--text-2);
  border-radius:var(--pill);padding:1px 8px;margin:0 8px 24px 0;font-size:10px}
.leaflet-control-attribution a{color:var(--text-2)}
/* Leaflet pinta de azul todo enlace dentro del mapa (`.leaflet-container a`), y
   la ficha del territorio vive dentro: sin esto, sus botones salen azules */
.leaflet-container a{color:inherit}

.sheet{background:var(--bg);border-top:1px solid var(--border);border-radius:24px 24px 0 0;
  display:flex;flex-direction:column;z-index:500;max-height:62%;flex:0 0 auto;position:relative}
.grab{display:flex;align-items:center;justify-content:center;min-height:30px;
  padding:9px 12px 6px;cursor:pointer;position:relative}
/* con el listado oculto la barra es lo único que queda: se agranda para
   que sea cómoda de tocar */
#sheet.oculto .grab{min-height:42px;padding-bottom:max(8px,var(--safe-b))}
/* la barra son dos mitades que se superponen: en reposo se leen como una
   sola línea, y al apuntarla se inclinan hasta formar una flecha */
.grab .bar{position:relative;width:40px;height:10px}
.grab .bar::before,.grab .bar::after{content:'';position:absolute;top:3px;width:21px;height:4px;
  border-radius:3px;background:var(--border);transition:transform .2s ease,background .2s ease}
.grab .bar::before{left:0;transform-origin:left center}
.grab .bar::after{right:0;transform-origin:right center}
/* ▲ va a mostrar el listado */
.grab.tocando .bar::before{transform:rotate(-17deg)}
.grab.tocando .bar::after{transform:rotate(17deg)}
/* ▼ va a ocultarlo */
.grab.cerrar.tocando .bar::before{transform:rotate(17deg)}
.grab.cerrar.tocando .bar::after{transform:rotate(-17deg)}
.grab.tocando .bar::before,.grab.tocando .bar::after{background:var(--text)}
@media (hover:hover){
  .grab:hover .bar::before{transform:rotate(-17deg)}
  .grab:hover .bar::after{transform:rotate(17deg)}
  .grab.cerrar:hover .bar::before{transform:rotate(17deg)}
  .grab.cerrar:hover .bar::after{transform:rotate(-17deg)}
  .grab:hover .bar::before,.grab:hover .bar::after{background:var(--text)}
}
.sheet .list{overflow-y:auto;padding:2px 20px 10px;-webkit-overflow-scrolling:touch}

/* Tarjeta: la hora hace de indicador a la izquierda, el texto al medio y el
   número de territorio —la cifra— a la derecha. */
.act{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;
  min-height:68px;padding:10px 14px;margin-bottom:8px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
.act.sel{background:var(--surface-2);border-color:var(--text)}
.hora{font-size:16px;font-weight:500;letter-spacing:-.02em}
.hora small{display:block;font-size:13px;font-weight:400;color:var(--text-2);letter-spacing:0}
.act.sel .hora small{color:var(--text-2)}
.info{min-width:0}
.info .cap{font-size:16px;font-weight:500}
.info .meta{color:var(--text-2);font-weight:400;font-size:13px;margin-top:1px}
.info .dir{font-size:13px;font-weight:400;margin-top:2px;color:var(--text)}
.terrchip{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tnum{font-size:22px;font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.tnum.calles{font-size:14px;font-weight:400;color:var(--text-2);letter-spacing:0}
/* enlace discreto, no un botón: la fila entera ya es tocable */
.go{font-size:13px;font-weight:400;color:var(--text-2);text-decoration:underline;
  text-underline-offset:3px;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:400;border:1px solid var(--border);
  border-radius:var(--pill);padding:0 8px;color:var(--text-2);margin-left:6px;vertical-align:1px}
/* la nota del día es una línea de texto, no una tarjeta: es un aviso corto y
   ocupando un bloque entero le quitaba sitio al listado */
.nota{margin:6px 4px 10px;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--text)}
.vacio{padding:24px 6px;color:var(--text-2);font-weight:400;text-align:center}

.fabs{position:absolute;right:10px;top:10px;display:flex;flex-direction:row;gap:10px;z-index:450}
.fab{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.fab svg{width:20px;height:20px;display:block}
.fab.on{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
/* Las tres barras que había —vista, marcado y fondo— en una sola fila de
   iconos, leída como un selector segmentado. El fondo del mapa, que es lo que
   menos se toca y lo que más opciones tiene, se despliega debajo al pedirlo. */
.mapbar{position:absolute;left:10px;top:10px;z-index:450;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--pill);padding:4px}
.mapbar .grupo{display:flex;gap:2px}
.mapbar button{border:0;background:transparent;color:var(--text-2);width:34px;height:34px;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mapbar button svg{width:20px;height:20px;display:block}
.mapbar button.on{background:var(--ink);color:var(--ink-text)}
.mapbar .sep{width:1px;align-self:stretch;background:var(--border);margin:4px}
.mapbar .oculta{display:none}

.popfondo{position:absolute;left:10px;top:58px;z-index:450;display:flex;gap:6px;flex-wrap:wrap;
  max-width:calc(100% - 20px);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:6px}
.popfondo.oculta,.popfondo .grupofondo.oculta{display:none}
.popfondo .grupofondo{display:flex;gap:6px;flex-wrap:wrap}
.popfondo button{border:1px solid var(--border);background:transparent;color:var(--text-2);
  font-size:13px;font-weight:500;padding:5px 12px;border-radius:var(--pill);cursor:pointer}
.popfondo button.on{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}

.tpanel{position:absolute;left:10px;right:10px;bottom:30px;z-index:460;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:none}
.tpanel.show{display:block}
.tpanel h3{margin:0 0 4px;font-size:22px;font-weight:500;letter-spacing:-.02em;
  display:flex;align-items:center;gap:8px;line-height:1.2}
.dot{width:14px;height:14px;border-radius:4px;border:1px solid var(--border);
  display:inline-block;flex:0 0 auto}
.tpanel .sub{color:var(--text-2);font-weight:400;font-size:13px;line-height:1.5}
/* el día que se está mirando, resaltado dentro de la lista */
.tpanel .dias b{color:var(--text);font-weight:500}
.tpanel .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.tpanel .dato{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.tpanel .dato-nombre{font-size:16px;font-weight:500}
.tpanel .dato-hora{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-top:1px}
.tpanel .dato-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.tpanel .dato-fila .btn{flex:0 0 auto}
.tpanel .dato-dir{min-width:0;overflow-wrap:anywhere;font-size:13px;font-weight:400;
  color:var(--text-2);text-decoration:underline;text-underline-offset:3px}
/* oculto: queda solo la barra, para volver a desplegar el listado */
#sheet.oculto .list,#sheet.oculto .datebar{display:none}
.btn{border:1px solid var(--border);background:transparent;color:var(--text);
  border-radius:var(--pill);padding:0 16px;height:40px;font-size:14px;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.close{margin-left:auto;color:var(--text-2);cursor:pointer;font-size:20px;line-height:1}
.leaflet-popup-content{margin:8px 10px;font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--text)}

/* hoja de ajustes: <dialog> anclado abajo, la única pieza con sombra */
dialog{border:0;padding:0;margin:0 0 0 auto;width:100%;max-width:100%;
  position:fixed;left:0;right:0;bottom:0;top:auto;background:var(--surface);color:var(--text);
  border-radius:24px 24px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .hoja{display:flex;flex-direction:column;gap:14px;
  padding:18px 20px max(18px,var(--safe-b))}
dialog h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.02em}
.campo label{display:block;font-size:13px;font-weight:400;color:var(--text-2);margin-bottom:6px}
.diag{font-size:12px;font-weight:400;color:var(--text-2);line-height:1.6;overflow-wrap:anywhere}
.diag b{font-weight:500;color:var(--text)}
.seg{display:flex;gap:2px;background:var(--surface-2);border-radius:var(--pill);padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--text-2);font-size:14px;
  font-weight:500;height:36px;border-radius:var(--pill);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--ink-text)}
dialog .pie{display:flex;gap:10px;justify-content:flex-end}

/* vista Dibujo: fondo liso, sin foto ni mapa, con los nombres de las calles.
   Tiene su propio claro/oscuro, aparte del de la interfaz: es un dibujo, no
   una interfaz, y lo elige el mismo botón de capas. */
body.dibujo #map,
body.dibujo .leaflet-container{background:var(--map-paper)}
.rotulo{position:absolute;white-space:nowrap;font-size:9px;font-weight:500;
  letter-spacing:.4px;color:var(--map-ink-2);text-transform:uppercase;pointer-events:none;
  text-shadow:0 0 3px var(--map-paper),0 0 3px var(--map-paper),0 0 3px var(--map-paper)}
/* la letra de la manzana, bien chica en su esquina de arriba a la izquierda: se
   dibuja hacia dentro desde el vértice, que es donde está la cuadra */
/* van en la sans del sistema y no en la de la app: a este tamaño los remates de
   la Space Grotesk se empastan y la letra cuesta leerla. Son anotaciones sobre
   el mapa, como los números del plano, no interfaz. */
.letramz{position:absolute;transform:translate(5px,2px);font-size:9.5px;font-weight:700;
  font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  letter-spacing:0;color:var(--map-ink);pointer-events:none;
  text-shadow:0 0 3px var(--map-paper),0 0 3px var(--map-paper),0 0 2px var(--map-paper)}

/* el número del territorio, como en el plano: sin chapa, solo el número con un
   halo que lo despega del color de abajo */
.nterr{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:13px;
  letter-spacing:-.03em;color:var(--map-ink);pointer-events:none;
  text-shadow:0 0 4px var(--map-paper),0 0 4px var(--map-paper),
              0 0 3px var(--map-paper),0 0 3px var(--map-paper)}
/* El territorio que toca hoy: un disco tinta, el mismo que marca el día elegido
   en la tira de abajo. El rojo queda para una sola cosa —el territorio que se
   está mirando—, así los dos no compiten. El aro del color de la superficie lo
   despega del color del territorio, sea cual sea. */
.tlabel{display:flex;width:26px;height:26px;align-items:center;justify-content:center;
  background:var(--map-ink);color:var(--map-paper);font-weight:500;font-size:13px;
  letter-spacing:-.02em;border-radius:50%;border:1px solid var(--map-paper)}
/* aviso: píldora tinta sobre el panel de abajo */
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:32px;z-index:470;
  background:var(--ink);color:var(--ink-text);padding:8px 16px;border-radius:var(--pill);
  font-size:14px;display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titulo">Territorios Alameda<span id="mestitulo"></span></div>
    <button id="btnAjustes" aria-label="Ajustes">⋯</button>
  </header>

  <div id="map">
    <div class="mapbar">
      <div class="grupo" id="barVista">
        <button data-layer="mapa" class="on" title="Mapa de calles" aria-label="Mapa de calles"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 5.6 7.4 3.6l5.2 2 4.8-2v11.8l-4.8 2-5.2-2-4.8 2z"/><path d="M7.4 3.6v11.8M12.6 5.6v11.8"/></g></svg></button>
        <button data-layer="plano" title="Plano" aria-label="Plano"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 2.8h7.2l3.6 3.6v10.8H4.6z"/><path d="M11.8 2.8v3.6h3.6"/><path d="M7 9.4h5.4M7 12.6h5.4"/></g></svg></button>
        <button data-layer="ambos" title="Plano sobre el mapa" aria-label="Plano sobre el mapa"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 7.4h9.8v9.8H2.8z"/><path d="M7.4 7.4V2.8h9.8v9.8h-4.6"/></g></svg></button>
        <button data-layer="dibujo" title="Dibujo" aria-label="Dibujo"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 16.6l.9-3.4 8.4-8.4 2.5 2.5-8.4 8.4z"/><path d="M11.6 3.9l2.5 2.5"/></g></svg></button>
      </div>
      <span class="sep" id="sepTerr"></span>
      <div class="grupo" id="barTerr">
        <button data-terr="manzanas" class="on" title="Marcar las manzanas" aria-label="Marcar las manzanas"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.9 2.9h5.4v5.4H2.9zM11.7 2.9h5.4v5.4h-5.4zM2.9 11.7h5.4v5.4H2.9zM11.7 11.7h5.4v5.4h-5.4z"/></g></svg></button>
        <button data-terr="borde" title="Marcar solo el borde" aria-label="Marcar solo el borde"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 2.9h10.8a1.7 1.7 0 0 1 1.7 1.7v10.8a1.7 1.7 0 0 1-1.7 1.7H4.6a1.7 1.7 0 0 1-1.7-1.7V4.6a1.7 1.7 0 0 1 1.7-1.7z"/></g></svg></button>
      </div>
      <span class="sep oculta" id="sepFondo"></span>
      <button class="suelto oculta" id="btnFondo" title="Mapa de fondo" aria-label="Mapa de fondo"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.6 17.4 6.8 10 11 2.6 6.8z"/><path d="M2.6 10.6 10 14.8l7.4-4.2"/><path d="M2.6 14.2 10 18.4l7.4-4.2"/></g></svg></button>
    </div>
    <div class="popfondo oculta" id="popFondo">
      <div class="grupofondo" id="fondosMapa">
        <button data-base="carto" class="on">CARTO</button>
        <button data-base="osm">OSM</button>
        <button data-base="gris">Gris</button>
        <button data-base="calles">Calles</button>
        <button data-base="claro">Claro</button>
        <button data-base="oscuro">Oscuro</button>
      </div>
      <div class="grupofondo oculta" id="fondosDibujo">
        <button data-dib="claro" class="on">Claro</button>
        <button data-dib="oscuro">Oscuro</button>
      </div>
    </div>
    <div class="fabs">
      <button class="fab" id="fabGps" title="Dónde estoy" aria-label="Dónde estoy"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="4.4"/><circle cx="10" cy="10" r="1.1" fill="currentColor" stroke="none"/><path d="M10 1.6v2.6M10 15.8v2.6M1.6 10h2.6M15.8 10h2.6"/></g></svg></button>
      <button class="fab" id="fabFit" title="Ver todo" aria-label="Ver todo"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 2.8H2.8v4.4M12.8 2.8h4.4v4.4M17.2 12.8v4.4h-4.4M2.8 12.8v4.4h4.4"/></g></svg></button>
    </div>
    <div class="tpanel" id="tpanel"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="sheet" id="sheet">
    <div class="grab" id="grab" title="Mostrar u ocultar el listado"><div class="bar"></div></div>
    <div class="list" id="lista"></div>
    <div class="datebar" id="datebar">
      <button class="iconbtn flecha" id="prev" aria-label="Día anterior">‹</button>
      <div class="week" id="week"></div>
      <button class="iconbtn flecha" id="next" aria-label="Día siguiente">›</button>
      <button class="iconbtn" id="btnHoy" title="Ir a hoy">Hoy</button>
    </div>
  </div>
</div>

<dialog id="ajustes">
  <div class="hoja">
    <h2>Ajustes</h2>
    <div class="campo">
      <label for="segTema">Tema de la app</label>
      <div class="seg" id="segTema">
        <button type="button" data-tema="auto">Auto</button>
        <button type="button" data-tema="light">Claro</button>
        <button type="button" data-tema="dark">Oscuro</button>
      </div>
    </div>
    <div class="campo">
      <label>Diagnóstico</label>
      <div class="diag" id="diag"></div>
    </div>
    <div class="pie"><button class="btn" id="cerrarAjustes">Cerrar</button></div>
  </div>
</dialog>

<script src="leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
