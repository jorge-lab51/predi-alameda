<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1d3b5c">
<meta name="robots" content="noindex, nofollow">
<title>Territorios Alameda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#16202b; --muted:#6a7787;
  --line:#e3e7ec; --accent:#1d3b5c; --accent2:#2f7d5b; --warn:#b4531f;
  --chip:#eef1f5; --shadow:0 2px 10px rgba(16,32,48,.10);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12161b; --panel:#1a2029; --ink:#e8edf3; --muted:#9aa7b6;
  --line:#28313d; --accent:#7fb2e5; --accent2:#6fcf9f; --chip:#232c37;
  --shadow:0 2px 12px rgba(0,0,0,.45); }
}
:root[data-theme="dark"]{ --bg:#12161b; --panel:#1a2029; --ink:#e8edf3; --muted:#9aa7b6;
  --line:#28313d; --accent:#7fb2e5; --accent2:#6fcf9f; --chip:#232c37;
  --shadow:0 2px 12px rgba(0,0,0,.45); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}

/* El header quedó en una línea: el nombre de la app y el mes, nada más. La
   navegación por días se mudó al pie del listado, que es donde se usa. */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:5px 10px 6px;
  padding-top:calc(5px + env(safe-area-inset-top,0px));box-shadow:var(--shadow);z-index:600}
.titulo{font-size:12px;font-weight:700;letter-spacing:.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-align:center}
.titulo span{font-weight:500;color:var(--muted)}
.titulo span::before{content:' · '}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;
  min-width:38px;height:34px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 8px}
.iconbtn:active{background:var(--chip)}
.iconbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* la tira de días vive al pie de la hoja, bajo el listado */
.datebar{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);
  padding:5px 8px calc(5px + var(--safe-b))}
.datebar .flecha{min-width:26px;height:40px;padding:0 2px;font-size:18px;border-color:transparent;background:transparent}
.datebar #btnHoy{height:40px;font-size:13px;font-weight:600;padding:0 9px}
/* `position` para que el `offsetLeft` de los chips se mida contra la tira y no
   contra el header: si no, posicionarTira() se pasa el ancho de la flecha */
.week{position:relative;flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.wd{flex:0 0 auto;min-width:40px;text-align:center;border:1px solid var(--line);border-radius:9px;
  padding:3px 6px;background:var(--panel);cursor:pointer}
.wd b{display:block;font-size:15px;line-height:1.1}
.wd i{font-style:normal;font-size:9.5px;line-height:1.2;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.wd.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.wd.sel i{color:#dbe7f3}
.wd.hoy{border-color:var(--accent2);border-width:2px}

#map{flex:1 1 auto;min-height:120px;background:#dfe4ea;z-index:1}
.leaflet-container{font:inherit;background:#e8ecf1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaflet-container{background:#1b222b}}
:root[data-theme="dark"] .leaflet-container{background:#1b222b}

.sheet{background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(16,32,48,.10);
  display:flex;flex-direction:column;z-index:500;max-height:62dvh;flex:0 0 auto}
.grab{display:flex;align-items:center;justify-content:center;min-height:30px;
  padding:7px 12px 6px;cursor:pointer;position:relative}
/* con el listado oculto la barra es lo único que queda: se agranda para
   que sea cómoda de tocar */
#sheet.oculto .grab{min-height:42px;padding-bottom:calc(8px + var(--safe-b))}
/* la barra son dos mitades que se superponen: en reposo se leen como una
   sola línea, y al apuntarla se inclinan hasta formar una flecha */
.grab .bar{position:relative;width:40px;height:10px}
.grab .bar::before,.grab .bar::after{content:'';position:absolute;top:3px;width:21px;height:4px;
  border-radius:3px;background:var(--line);transition:transform .2s ease,background .2s ease}
.grab .bar::before{left:0;transform-origin:left center}
.grab .bar::after{right:0;transform-origin:right center}
/* ▲ va a mostrar el listado */
.grab.tocando .bar::before{transform:rotate(-17deg)}
.grab.tocando .bar::after{transform:rotate(17deg)}
/* ▼ va a ocultarlo */
.grab.cerrar.tocando .bar::before{transform:rotate(17deg)}
.grab.cerrar.tocando .bar::after{transform:rotate(-17deg)}
.grab.tocando .bar::before,.grab.tocando .bar::after{background:var(--accent)}
@media (hover:hover){
  .grab:hover .bar::before{transform:rotate(-17deg)}
  .grab:hover .bar::after{transform:rotate(17deg)}
  .grab.cerrar:hover .bar::before{transform:rotate(17deg)}
  .grab.cerrar:hover .bar::after{transform:rotate(-17deg)}
  .grab:hover .bar::before,.grab:hover .bar::after{background:var(--accent)}
}
.sheet .list{overflow-y:auto;padding:2px 10px 8px;-webkit-overflow-scrolling:touch}

.act{display:flex;gap:9px;padding:9px 8px;border-radius:12px;border:1px solid transparent;align-items:flex-start}
.act + .act{border-top:1px solid var(--line)}
.act.sel{background:var(--chip);border-color:var(--line)}
.hora{flex:0 0 62px;font-weight:700;font-size:13px;color:var(--accent);padding-top:1px}
.hora small{display:block;font-weight:500;color:var(--muted);font-size:10px}
.info{flex:1;min-width:0}
.info .cap{font-weight:600;font-size:14px}
.info .meta{color:var(--muted);font-size:12.5px;margin-top:1px}
.info .dir{font-size:13px;margin-top:3px;color:var(--ink)}
.terrchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
.tnum{min-width:42px;text-align:center;border-radius:9px;padding:4px 6px;font-weight:700;font-size:14px;
  background:var(--chip);border:1px solid var(--line)}
.tnum.calles{font-size:11px;font-weight:600;letter-spacing:.4px}
.go{font-size:11.5px;font-weight:600;color:#fff;text-decoration:none;border:1px solid var(--accent);
  border-radius:8px;padding:4px 8px;background:var(--accent);white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--muted);margin-left:6px}
.tag.reunion{background:#e7efe9;color:#2f7d5b}
.tag.cartas{background:#f2ecdf;color:#8a6521}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.reunion{background:#1f3329;color:#8fdcb4}
  :root:not([data-theme="light"]) .tag.cartas{background:#33291a;color:#e2c185}}
:root[data-theme="dark"] .tag.reunion{background:#1f3329;color:#8fdcb4}
:root[data-theme="dark"] .tag.cartas{background:#33291a;color:#e2c185}
.nota{margin:6px 2px 2px;font-size:12px;color:var(--warn);font-weight:600}
.vacio{padding:18px 6px;color:var(--muted);text-align:center}

.fabs{position:absolute;right:10px;top:10px;display:flex;flex-direction:row;gap:8px;z-index:450}
.fab{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer}
.fab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Las tres barras que había —vista, marcado y fondo— en una sola fila de
   iconos. El fondo del mapa, que es lo que menos se toca y lo que más opciones
   tiene, se despliega debajo al pedirlo. */
.mapbar{position:absolute;left:10px;top:10px;z-index:450;display:flex;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--shadow)}
.mapbar .grupo{display:flex;gap:2px}
.mapbar button{border:0;background:transparent;color:var(--muted);width:34px;height:34px;
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mapbar button svg{width:20px;height:20px;display:block}
.mapbar button.on{background:var(--accent);color:#fff}
.mapbar .sep{width:1px;align-self:stretch;background:var(--line);margin:3px}
.mapbar .oculta{display:none}

.popfondo{position:absolute;left:10px;top:56px;z-index:450;display:flex;gap:4px;flex-wrap:wrap;
  max-width:calc(100% - 20px);background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:4px;box-shadow:var(--shadow)}
.popfondo.oculta,.popfondo .grupofondo.oculta{display:none}
.popfondo .grupofondo{display:flex;gap:4px;flex-wrap:wrap}
.popfondo button{border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;
  padding:5px 8px;border-radius:8px;cursor:pointer}
.popfondo button.on{background:var(--accent);color:#fff}

.tpanel{position:absolute;left:10px;right:10px;bottom:12px;z-index:460;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:none}
.tpanel.show{display:block}
.tpanel h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;line-height:1.2}
.dot{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25);display:inline-block}
.tpanel .sub{color:var(--muted);font-size:12.5px;line-height:1.5}
/* el día que se está mirando, resaltado dentro de la lista */
.tpanel .dias b{color:var(--accent);font-weight:700}
.tpanel .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tpanel .dato{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.tpanel .dato-nombre{font-weight:600;font-size:14.5px}
.tpanel .dato-hora{font-weight:700;font-size:14px;color:var(--accent);margin-top:1px}
.tpanel .dato-fila{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:3px}
.tpanel .dato-fila .btn{flex:0 0 auto}
.tpanel .dato-dir{min-width:0;overflow-wrap:anywhere;font-size:14px;color:var(--ink);
  text-decoration:none;border-bottom:1px dashed var(--muted)}
.tpanel .dato-dir:active{color:var(--accent)}
/* oculto: queda solo la barra, para volver a desplegar el listado */
#sheet.oculto .list,#sheet.oculto .datebar{display:none}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;
  padding:6px 10px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.done{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.close{margin-left:auto;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.leaflet-popup-content{margin:8px 10px;font:inherit}
/* vista Dibujo: fondo liso, sin foto ni mapa, con los nombres de las calles */
/* la vista Dibujo tiene su propio claro/oscuro, aparte del del sistema: es un
   dibujo, no una interfaz, y hay quien lo prefiere sobre papel y quien sobre
   negro. Lo elige el mismo botón de capas. */
body.dibujo #map,
body.dibujo .leaflet-container{background:#fdfdfb}
body.dibujo.dibujo-oscuro #map,
body.dibujo.dibujo-oscuro .leaflet-container{background:#141a21}
body.dibujo.dibujo-oscuro .rotulo{color:#a7b4c2;
  text-shadow:0 0 3px #141a21,0 0 3px #141a21,0 0 3px #141a21}
.rotulo{position:absolute;white-space:nowrap;font-size:9px;font-weight:600;
  letter-spacing:.4px;color:#4a5560;text-transform:uppercase;pointer-events:none;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.tlabel{background:#c62828;color:#fff;font-weight:700;font-size:12px;border-radius:9px;
  padding:2px 0;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:470;background:rgba(20,30,40,.86);
  color:#fff;padding:7px 12px;border-radius:20px;font-size:12.5px;display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titulo">Territorios Alameda<span id="mestitulo"></span></div>
  </header>

  <div id="map">
    <div class="mapbar">
      <div class="grupo" id="barVista">
        <button data-layer="mapa" class="on" title="Mapa de calles" aria-label="Mapa de calles"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 5.6 7.4 3.6l5.2 2 4.8-2v11.8l-4.8 2-5.2-2-4.8 2z"/><path d="M7.4 3.6v11.8M12.6 5.6v11.8"/></g></svg></button>
        <button data-layer="plano" title="Plano" aria-label="Plano"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 2.8h7.2l3.6 3.6v10.8H4.6z"/><path d="M11.8 2.8v3.6h3.6"/><path d="M7 9.4h5.4M7 12.6h5.4"/></g></svg></button>
        <button data-layer="ambos" title="Plano sobre el mapa" aria-label="Plano sobre el mapa"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 7.4h9.8v9.8H2.8z"/><path d="M7.4 7.4V2.8h9.8v9.8h-4.6"/></g></svg></button>
        <button data-layer="dibujo" title="Dibujo" aria-label="Dibujo"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 16.6l.9-3.4 8.4-8.4 2.5 2.5-8.4 8.4z"/><path d="M11.6 3.9l2.5 2.5"/></g></svg></button>
      </div>
      <span class="sep" id="sepTerr"></span>
      <div class="grupo" id="barTerr">
        <button data-terr="manzanas" class="on" title="Marcar las manzanas" aria-label="Marcar las manzanas"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.9 2.9h5.4v5.4H2.9zM11.7 2.9h5.4v5.4h-5.4zM2.9 11.7h5.4v5.4H2.9zM11.7 11.7h5.4v5.4h-5.4z"/></g></svg></button>
        <button data-terr="borde" title="Marcar solo el borde" aria-label="Marcar solo el borde"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 2.9h10.8a1.7 1.7 0 0 1 1.7 1.7v10.8a1.7 1.7 0 0 1-1.7 1.7H4.6a1.7 1.7 0 0 1-1.7-1.7V4.6a1.7 1.7 0 0 1 1.7-1.7z"/></g></svg></button>
      </div>
      <span class="sep oculta" id="sepFondo"></span>
      <button class="suelto oculta" id="btnFondo" title="Mapa de fondo" aria-label="Mapa de fondo"><svg viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.6 17.4 6.8 10 11 2.6 6.8z"/><path d="M2.6 10.6 10 14.8l7.4-4.2"/><path d="M2.6 14.2 10 18.4l7.4-4.2"/></g></svg></button>
    </div>
    <div class="popfondo oculta" id="popFondo">
      <div class="grupofondo" id="fondosMapa">
        <button data-base="carto" class="on">CARTO</button>
        <button data-base="osm">OSM</button>
        <button data-base="gris">Gris</button>
        <button data-base="calles">Calles</button>
        <button data-base="claro">Claro</button>
        <button data-base="oscuro">Oscuro</button>
      </div>
      <div class="grupofondo oculta" id="fondosDibujo">
        <button data-dib="claro" class="on">Claro</button>
        <button data-dib="oscuro">Oscuro</button>
      </div>
    </div>
    <div class="fabs">
      <button class="fab" id="fabGps" title="Dónde estoy">◎</button>
      <button class="fab" id="fabFit" title="Ver todo">⤢</button>
    </div>
    <div class="tpanel" id="tpanel"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="sheet" id="sheet">
    <div class="grab" id="grab" title="Mostrar u ocultar el listado"><div class="bar"></div></div>
    <div class="list" id="lista"></div>
    <div class="datebar" id="datebar">
      <button class="iconbtn flecha" id="prev" aria-label="Día anterior">‹</button>
      <div class="week" id="week"></div>
      <button class="iconbtn flecha" id="next" aria-label="Día siguiente">›</button>
      <button class="iconbtn" id="btnHoy" title="Ir a hoy">Hoy</button>
    </div>
  </div>
</div>
<script src="leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
